/*
 * Add your dependencies here. Supported configurations:
 *  - api("group:name:version:classifier"): if you use the types from this dependency in the public API of this mod
 *       Available at runtime and compiletime for mods depending on this mod
 *  - implementation("g:n:v:c"): if you need this for internal implementation details of the mod, but none of it is visible via the public API
 *       Available at runtime but not compiletime for mods depending on this mod
 *  - compileOnly("g:n:v:c"): if the mod you're building doesn't need this dependency during runtime at all, e.g. for optional mods
 *       Not available at all for mods depending on this mod, only visible at compiletime for this mod
 *  - compileOnlyApi("g:n:v:c"): like compileOnly, but also visible at compiletime for mods depending on this mod
 *       Available at compiletime but not runtime for mods depending on this mod
 *  - runtimeOnlyNonPublishable("g:n:v:c"): if you want to include a mod in this mod's runClient/runServer runs, but not publish it as a dependency
 *       Not available at all for mods depending on this mod, only visible at runtime for this mod
 *  - devOnlyNonPublishable("g:n:v:c"): a combination of runtimeOnlyNonPublishable and compileOnly for dependencies present at both compiletime and runtime,
 *       but not published as Maven dependencies - useful for RFG-deobfuscated dependencies or local testing
 *  - runtimeOnly("g:n:v:c"): if you don't need this at compile time, but want it to be present at runtime
 *       Available at runtime for mods depending on this mod
 *  - annotationProcessor("g:n:v:c"): mostly for java compiler plugins, if you know you need this, use it, otherwise don't worry
 *  - testCONFIG("g:n:v:c") - replace CONFIG by one of the above (except api), same as above but for the test sources instead of main
 *
 *  - shadowImplementation("g:n:v:c"): effectively the same as API, but the dependency is included in your jar under a renamed package name
 *       Requires you to enable usesShadowedDependencies in gradle.properties
 *
 *  - compile("g:n:v:c"): deprecated, replace with "api" (works like the old "compile") or "implementation" (can be more efficient)
 *
 * You can exclude transitive dependencies (dependencies of the chosen dependency) by appending { transitive = false } if needed,
 * but use this sparingly as it can break using your mod as another mod's dependency if you're not careful.
 *
 * To depend on obfuscated jars you can use `devOnlyNonPublishable(rfg.deobf("dep:spec:1.2.3"))` to fetch an obfuscated jar from maven,
 * or `devOnlyNonPublishable(rfg.deobf(project.files("libs/my-mod-jar.jar")))` to use a file.
 *
 * Gradle names for some of the configuration can be misleading, compileOnlyApi and runtimeOnly both get published as dependencies in Maven, but compileOnly does not.
 * The buildscript adds runtimeOnlyNonPublishable to also have a runtime dependency that's not published.
 *
 * For more details, see https://docs.gradle.org/8.0.1/userguide/java_library_plugin.html#sec:java_library_configurations_graph
 */
dependencies {
    // Minimal dependency set for current source usage.
    // Sources reference only GregTech API types (gregtech.api.*), so keep GT5-Unofficial.
    // User has an external hard backup of the original file, so this file is intentionally simplified.
    // 2.9.0-RC-1 基线：GT5U 5.09.54.183（v1.7.18 曾回退 5.09.52.594+VM 0.4.87 做 beta-1 兼容，beta-3 迁移后放弃该窗口）
    // 基线代际口径：源码面守四代 —— beta-1 5.09.52.594 / beta-2 5.09.54.20 / beta-3（= 本行换基线前的前值）/ RC-1 5.09.54.183。
    // 「守四代」只承诺源码不含仅高版本写法；已实测腿 = RC-1 一格（compileJava、build 与六个 JavaExec 套件），
    // beta-3 腿由换基线前的 v1.8.38（commit 2636205）承担，b1/b2 两代依赖集未定义、不实测也不对外许诺。
    // 不采用仅高版本写法：GT5U 侧唯一可选的仅高版本形态是 Textures.BlockIcons.custom(domain, name) 双参重载，它 beta-3 才引入、
    // beta-1/beta-2 两腿（源级 + javap）都不存在，采用即破那两代编译；四代完整数值枚举见 register/TextureManager.java 的兼容注释。
    // GT5U 正式版发布时：把本行 token 换成正式版坐标，并同步移除上述"守四代"约束与 Java 侧各 beta 兼容注释。
    // 判据出处：plan/gtit-rc1-baseline-20260925/evidence/r1-gtit-todo-table.md、evidence/r5-survival-legs.md，
    // 以及上游 plan/rc1-compat-20260925/work/rc1-version-triple.md §6 取值口径 P0-P6（P0 = 本仓现读）。
    api("com.github.GTNewHorizons:GT5-Unofficial:5.09.54.183") { transitive = false }

    // Some GregTech base classes reference interfaces/types from other mods (AE2, ModularUI, GTNHLib) that are only
    // needed at compile-time to satisfy types —— but they are declared as `api` ON PURPOSE, not `compileOnlyApi`.
    // The six JavaExec suites in build.gradle.kts all consume sourceSets.test.runtimeClasspath, and build/tmp/testcp.txt
    // shows every `api` artifact below on that classpath while every real compileOnlyApi artifact (NotEnoughItems,
    // industrialcraft-2, BetterQuesting) is absent from it. Switching the group below to compileOnlyApi would make
    // runNestedCellProbeTest / runPocketTest lose AE2 classes at runtime —— proven rejection, do not "tidy" it here.
    // 代际面：这一组 `api` 腿在四代下形态一致（RC-1 已实测；beta-3 腿由换基线前的 v1.8.38（commit 2636205）承担，b1/b2 不实测也不对外许诺）。
    // 正式版清理动作：本块不含 beta 专属写法，GT5U 正式版发布后此处无需清理，只按上游 triple 复核版本 token。
    // 判据出处：plan/gtit-rc1-baseline-20260925/evidence/r1-gtit-todo-table.md（api 与 compileOnlyApi 的运行期类路径实测）。
    api("com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-1073-GTNH:dev") { transitive = false }
    api("com.github.GTNewHorizons:ModularUI:1.3.4:dev") { transitive = false }
    api("com.github.GTNewHorizons:ModularUI2:2.3.91-1.7.10:dev") { transitive = false }
    api("com.github.GTNewHorizons:GTNHLib:0.11.51:dev") { transitive = false }
    api("com.github.GTNewHorizons:Baubles-Expanded:2.2.6-GTNH:dev") { transitive = false }

    // [S0-PROBE → 已定稿] 神秘时代桥接层（crossmod/taum）。
    // 必须用 compileOnly 而非 compileOnlyApi：本文件 :31 原文写明
    // "compileOnlyApi and runtimeOnly both get published as dependencies in Maven, but compileOnly does not"
    // —— 闭源 TC 一旦进发布 POM 会逼下游解析。坐标与 GT5U dependencies.gradle:89 逐字同款。
    // ThaumicTinkerer 不加编译依赖：其 dev jar 2.12.22/27/32 全量解包后 `grep -rli vessel` 零命中，
    // 该 fork 内不存在 ItemVessel 类，写成 import 必编译失败；源质容器改由 GameRegistry 字符串探测
    // + IEssentiaContainerItem 校验承担（见 crossmod/taum/TaumBridge），任何第三方容器按接口自动兼容。
    compileOnly("thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev") { transitive = false }

    // VisualProspecting is required for JourneyMap integration (ore prospecting visualization).
    // Used by TelekinesisOreScannerCore to display ore veins on the map.
    api('com.github.GTNewHorizons:VisualProspecting:1.5.41:dev') { transitive = false }

    // StructureLib is required for multiblock machine structure definitions and building.
    api("com.github.GTNewHorizons:StructureLib:1.4.45:dev") { transitive = false }

    // NEI (Not Enough Items) is required for HandlerInfo used in RecipeMapBuilder.neiHandlerInfo()
    // 本行下方的 NotEnoughItems、以及 industrialcraft-2 与 BetterQuesting 两处才是真正的 compileOnlyApi（对照上方那组故意的 api）。
    // NEI 声明值 2.8.98-GTNH 与 RC-1 实例 shipped 值之差属 pin 落后的卫生项，用户已裁定本轮不顺手对齐，不构成 RC-1 破坏证据。
    // 代际面：compileOnlyApi 不进运行期类路径，故 NEI 在 beta-1 / beta-2 / beta-3 / RC-1 四代同口径（本轮只实测 RC-1）。
    // 正式版清理动作：GTNH 正式版发布时统一复核 NEI pin，届时本段卫生项说明可删；判据出处：plan/gtit-rc1-baseline-20260925/evidence/r1-gtit-todo-table.md。
    compileOnlyApi("com.github.GTNewHorizons:NotEnoughItems:2.8.98-GTNH:dev") { transitive = false }

    // IC2 API is required for implementing IElectricItem to support charging stations.
    compileOnlyApi("net.industrial-craft:industrialcraft-2:2.2.828-experimental:api") { transitive = false }

    // Vending Machine mod - required dependency for Neko Vending Machine system
    // VM 腿不在本轮 RC-1 六腿递进之列：上游 plan/rc1-compat-20260925/work/rc1-version-triple.md V-23 的动作 = 不变（文件即版本），未给第 7 腿。
    // 基线代际：beta-1 5.09.52.594 / beta-2 5.09.54.20 / beta-3 / RC-1 5.09.54.183 四代共用同一本地件 0.4.100
    // （0.4.100 自 2.9.0-beta-3 基线起使用；v1.7.18 曾本地 jar 0.4.87 做 beta-1 兼容）。
    // 0.4.100 未发布到 maven（nexus 两 group 404、jitpack 502），故 RC-1 下仍沿用 GitHub release 本地 jar + rfg.deobf 模式；
    // 不采用仅高版本写法：把本地 jar 换成 maven 坐标不是可执行动作（上游无该发布），本轮禁止顺手升 VM 版本。
    // 正式版清理动作：VM 若正式发布到 maven，替换下方 project.files 为 maven 坐标并删除本段；判据出处同上 V-23 与 evidence/r1-gtit-todo-table.md。
    devOnlyNonPublishable(rfg.deobf(project.files("libs/vendingmachine-0.4.100.jar")))

    // BetterQuesting API - compile-only, needed for QuestEvent listener (BqEventBridge)
    compileOnlyApi("com.github.GTNewHorizons:BetterQuesting:3.8.72-GTNH:dev") { transitive = false }


    // UniMixins is automatically included by the GTNH build script because usesMixins = true in gradle.properties.
    // No need to declare it manually.

    // If you need to run the mod in the dev environment (runClient/runServer),
    // you can uncomment the following line to include GregTech at runtime without publishing it.
    // devOnlyNonPublishable("com.github.GTNewHorizons:GT5-Unofficial:5.09.51.476")

    // Add test dependencies here if you plan to run unit tests locally.
    // (Optional) testImplementation(platform('org.junit:junit-bom:5.14.1'))
}


