
// Add any additional repositories for your dependencies here.

repositories {
	// v1.5.11+: 移除 TGregworks ivy 仓库（dependencies.gradle 中无任何 TGregworks group 引用，是死配置）

	// Allow resolving artifacts from the developer's local Maven repo if needed
	mavenLocal()

}

// Route Core only through its immutable distribution, avoiding probes in unrelated Maven repositories.
repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "miaokatzeCore"
                url = uri(project.findProperty("miaokatzeCoreRepository") ?: "https://raw.githubusercontent.com/MIAOKATZE/MIAOKATZE-Core/maven/")
            }
        }
        filter { includeGroup("com.miaokatze.miaokatzecore") }
    }
}
